    <!-- Ambient Background -->

        <div class="ambient-blob ambient-blob-2"></div>
    </div>

            </div>
        </header>

        <main class="processing-main">

            <section

                class="processing-card"
                aria-labelledby="pageTitle"
                aria-live="polite"

                <div class="processing-circle" aria-hidden="true">
                    <div class="processing-circle-ring"></div>

                            <path d="M3 12h18"></path>
                        </svg>
                    </div>
                </div>

                <!-- Header -->
                <h1 id="pageTitle" class="processing-title">
                    لنرتب الصورة.
                </h1>

                <p class="processing-description">
                    نجمع ما عرفناه عن هدفك ووضعك وإجاباتك،
                    ونرتبه بطريقة تساعدك على رؤية موقفك بوضوح أكبر.
                </p>


                <!-- Steps Timeline -->
                <div class="processing-steps">

                    <div class="processing-step active" id="step1">
                        <span class="processing-step-icon">
                            <svg class="step-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 3v18"></path>
                                <path d="M3 12h18"></path>
                            </svg>
                            <span class="step-spinner"></span>
                        </span>
                        <span class="processing-step-text">نفهم إجاباتك</span>
                    </div>

                    <div class="processing-step" id="step2">
                        <span class="processing-step-icon">
                            <svg class="step-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m5 12 4 4L19 6"></path>
                            </svg>
                            <span class="step-spinner"></span>
                        </span>
                        <span class="processing-step-text">نحدد ما هو واضح وما يحتاج توضيحًا</span>
                    </div>

                    <div class="processing-step" id="step3">
                        <span class="processing-step-icon">
                            <svg class="step-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M12 7v10"></path>
                                <path d="M7 12h10"></path>
                            </svg>
                            <span class="step-spinner"></span>
                        </span>
                        <span class="processing-step-text">نرتب ما يمكنك التأثير فيه</span>
                    </div>

                    <div class="processing-step" id="step4">
                        <span class="processing-step-icon">
                            <svg class="step-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14"></path>
                                <path d="m13 6 6 6-6 6"></path>
                            </svg>
                            <span class="step-spinner"></span>
                        </span>
                        <span class="processing-step-text">نجهز صورتك الأولية</span>
                    </div>

                </div>

            </section>


            <!-- ERROR CARD -->

                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l9 17H3L12 3Z"></path>
                        <path d="M12 9v5"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                </div>

                <h2 id="errorTitle" class="error-title">لحظة.</h2>

                </p>

                    href="assessment-introduction.html"
