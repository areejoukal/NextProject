<head>
    <meta charset="UTF-8">

    <meta name="twitter:title" content="اختيار الهدف — NEXT">
    <meta name="twitter:description" content="اختر الشيء الذي تريد أن تفهم وضعك من أجله.">
    <meta name="twitter:image" content="https://next.app/icons/og-goal-selection.png">
    <meta name="twitter:image:alt" content="NEXT — اختيار الهدف">

    <!-- Theme -->
    <meta name="theme-color" content="#F7F8FA">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-72.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXT">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="NEXT">

    <!-- STYLES -->
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/motion.css">
    <link rel="stylesheet" href="styles/pages/goal-selection.css">
</head>

<body data-page="goal-selection">

    <!-- Ambient Background -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-blob ambient-blob-1"></div>
        <div class="ambient-blob ambient-blob-2"></div>
    </div>


    <div class="onboarding-shell">

        <!-- TOPBAR -->
        <header class="onboarding-topbar">
            <div class="onboarding-topbar-inner">

                <a href="index.html" class="onboarding-brand" aria-label="NEXT">
                    <span class="onboarding-brand-mark">
                        <span class="brand-mark-bar brand-mark-bar-1"></span>
                        <span class="brand-mark-bar brand-mark-bar-2"></span>
                        <span class="brand-mark-bar brand-mark-bar-3"></span>
                        <span class="brand-mark-corner"></span>
                    </span>
                    <span class="onboarding-brand-name">NEXT</span>
                </a>

                <!-- Progress -->
                <div class="onboarding-progress" aria-label="تقدم الرحلة">
                    <span class="onboarding-progress-step active"></span>
                    <span class="onboarding-progress-step"></span>
                    <span class="onboarding-progress-step"></span>
                    <span class="onboarding-progress-step"></span>
                    <span class="onboarding-progress-step"></span>
                </div>

                <a href="welcome.html" class="onboarding-back">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                    رجوع
                </a>

            </div>
        </header>


        <!-- MAIN -->
        <main class="onboarding-main">

            <!-- HEADER -->
            <header class="onboarding-header">
                <div class="onboarding-eyebrow" data-anim="eyebrow">
                    <span class="onboarding-eyebrow-dot" aria-hidden="true"></span>
                    <span>الخطوة الأولى</span>
                </div>

                <h1 class="onboarding-title" data-anim="title">
                    ما هو الشيء الذي تريد<br>
                    <span class="onboarding-title-accent">أن تفهم وضعك من أجله؟</span>
                </h1>

                <p class="onboarding-description" data-anim="description">
                    اختر الهدف الأقرب لك الآن.
                    لا يلزم أن يكون هدفك النهائي — المهم أن يكون
                    الشيء الذي يشغلك حاليًا.
                </p>
            </header>


            <!-- GOAL GRID -->
            <section class="goal-grid" id="goalGrid" role="radiogroup" aria-label="اختر هدفك">

                <!-- Academic -->
                <button type="button" class="goal-option" style="--i: 0;"
                        data-goal="academic" data-label="الدراسة والماجستير"
                        role="radio" aria-checked="false">

                    <div class="goal-option-glow" aria-hidden="true"></div>

                    <div class="goal-option-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 10 12 5l10 5-10 5L2 10Z"></path>
                            <path d="M6 12v5c2.5 2 9.5 2 12 0v-5"></path>
                            <path d="M22 10v6"></path>
                        </svg>
                    </div>

                    <div class="goal-option-content">
                        <h3 class="goal-option-title">الدراسة والماجستير</h3>
                        <p class="goal-option-text">افهم استعدادك وخطوتك الأكاديمية القادمة.</p>
                    </div>

                    <span class="goal-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Employment -->
                <button type="button" class="goal-option" style="--i: 1;"
                        data-goal="employment" data-label="الحصول على وظيفة"
                        role="radio" aria-checked="false">

                    <div class="goal-option-glow" aria-hidden="true"></div>

                    <div class="goal-option-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="7" width="18" height="13" rx="2"></rect>
                            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <path d="M3 12h18"></path>
                            <path d="M10 12v2h4v-2"></path>
                        </svg>
                    </div>

                    <div class="goal-option-content">
                        <h3 class="goal-option-title">الحصول على وظيفة</h3>
                        <p class="goal-option-text">اعرف أين تقف بالنسبة للوظيفة التي تستهدفها.</p>
                    </div>

                    <span class="goal-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Career Growth -->
                <button type="button" class="goal-option" style="--i: 2;"
                        data-goal="career_growth" data-label="تطوير مساري المهني"
                        role="radio" aria-checked="false">

                    <div class="goal-option-glow" aria-hidden="true"></div>

                    <div class="goal-option-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 20h18"></path>
                            <path d="M5 17l5-5 3 3 6-7"></path>
                            <path d="M15 8h4v4"></path>
                        </svg>
                    </div>

                    <div class="goal-option-content">
                        <h3 class="goal-option-title">تطوير مساري المهني</h3>
                        <p class="goal-option-text">افهم الخطوة التالية في مسارك المهني.</p>
                    </div>

                    <span class="goal-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Career Change -->
                <button type="button" class="goal-option" style="--i: 3;"
                        data-goal="career_change" data-label="تغيير مجالي"
                        role="radio" aria-checked="false">

                    <div class="goal-option-glow" aria-hidden="true"></div>

                    <div class="goal-option-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19h16"></path>
                            <path d="M6 17V7"></path>
                            <path d="M18 17V4"></path>
                            <path d="m6 7 6 5 6-8"></path>
                        </svg>
                    </div>

                    <div class="goal-option-content">
                        <h3 class="goal-option-title">تغيير مجالي</h3>
                        <p class="goal-option-text">حدد وضعك الحالي وما تحتاجه للانتقال.</p>
                    </div>

                    <span class="goal-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Skills -->
                <button type="button" class="goal-option" style="--i: 4;"
                        data-goal="skills" data-label="تطوير مهاراتي"
                        role="radio" aria-checked="false">

                    <div class="goal-option-glow" aria-hidden="true"></div>

                    <div class="goal-option-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v18"></path>
                            <path d="M5 8h14"></path>
                            <path d="M7 8v5"></path>
                            <path d="M17 8v5"></path>
                            <path d="M5 13h4"></path>
                            <path d="M15 13h4"></path>
                        </svg>
                    </div>

                    <div class="goal-option-content">
                        <h3 class="goal-option-title">تطوير مهاراتي</h3>
                        <p class="goal-option-text">اعرف المهارات التي تحتاجها وما ينقصك منها.</p>
                    </div>

                    <span class="goal-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Other -->
                <button type="button" class="goal-option" style="--i: 5;"
                        data-goal="other" data-label="هدف مختلف"
                        role="radio" aria-checked="false">

                    <div class="goal-option-glow" aria-hidden="true"></div>

                    <div class="goal-option-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 8v4"></path>
                            <path d="M12 16h.01"></path>
                        </svg>
                    </div>

                    <div class="goal-option-content">
                        <h3 class="goal-option-title">لدي هدف مختلف</h3>
                        <p class="goal-option-text">لديك هدف مختلف وتريد أن ترتب صورته.</p>
                    </div>

                    <span class="goal-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

            </section>


            <!-- ACTIONS -->
            <div class="onboarding-actions">
                <button id="continueButton" type="button"
                        class="primary-button primary-button-large"
                        disabled data-cta="continue-goal">
                    <span class="button-shine" aria-hidden="true"></span>
                    <span>التالي</span>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m13 6 6 6-6 6"></path>
                    </svg>
                </button>

                <p class="onboarding-note">
                    يمكنك تغيير هدفك لاحقًا.
                </p>
            </div>

        </main>


        <!-- FOOTER -->
        <footer class="onboarding-footer">
            © 2026 NEXT — افهم أولًا. تحرّك ثانيًا.
        </footer>

    </div>


    <!-- SCRIPTS -->
    <script src="scripts/core/storage.js"></script>
    <script src="scripts/core/session.js"></script>
    <script src="scripts/core/ui.js"></script>
    <script src="scripts/core/motion.js"></script>
    <script src="scripts/pages/goal-selection.js"></script>
    <!-- PWA Script -->
    <script src="scripts/core/pwa.js"></script>
</body>

</html>
