    <meta name="twitter:description" content="اختر الوصف الأقرب لشعورك تجاه هدفك الآن.">
    <meta name="twitter:image" content="https://next.app/icons/og-current-state.png">
    <meta name="twitter:image:alt" content="NEXT — وضعك الحالي">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-72.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">

    <meta name="apple-mobile-web-app-title" content="NEXT">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- STYLES -->
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/motion.css">
    <link rel="stylesheet" href="styles/pages/current-state.css">
</head>

<body data-page="current-state">

    <!-- Ambient Background -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-blob ambient-blob-1"></div>
        <div class="ambient-blob ambient-blob-2"></div>
    </div>


    <div class="onboarding-shell">

        <!-- TOPBAR -->
        <header class="onboarding-topbar">
            <div class="onboarding-topbar-inner">

                <a href="index.html" class="onboarding-brand" aria-label="NEXT">
                    <span class="onboarding-brand-mark">
                        <span class="brand-mark-bar brand-mark-bar-1"></span>
                        <span class="brand-mark-bar brand-mark-bar-2"></span>
                        <span class="brand-mark-bar brand-mark-bar-3"></span>
                        <span class="brand-mark-corner"></span>
                    </span>
                    <span class="onboarding-brand-name">NEXT</span>
                </a>

                <!-- Progress (3/5) -->
                <div class="onboarding-progress" aria-label="تقدم الرحلة">
                    <span class="onboarding-progress-step completed"></span>
                    <span class="onboarding-progress-step completed"></span>
                    <span class="onboarding-progress-step active"></span>
                    <span class="onboarding-progress-step"></span>
                    <span class="onboarding-progress-step"></span>
                </div>

                <a href="goal-definition.html" class="onboarding-back">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                    رجوع
                </a>

            </div>
        </header>


        <!-- MAIN -->
        <main class="onboarding-main">

            <!-- HEADER -->
            <header class="onboarding-header">
                <div class="onboarding-eyebrow" data-anim="eyebrow">
                    <span class="onboarding-eyebrow-dot" aria-hidden="true"></span>
                    <span>الخطوة الثالثة</span>
                </div>

                <h1 class="onboarding-title" data-anim="title">
                    كيف ترى وضعك<br>
                    <span class="onboarding-title-accent">حاليًا؟</span>
                </h1>

                <p class="onboarding-description" data-anim="description">
                    لا نطلب منك تقييمًا دقيقًا. اختر الوصف الأقرب
                    لشعورك تجاه هدفك الآن.
                </p>
            </header>


            <!-- STATE OPTIONS -->
            <section class="state-options" id="stateOptions" role="radiogroup" aria-label="وصف الوضع الحالي">

                <!-- Clear -->
                <button type="button" class="state-option"
                        style="--i: 0; --state-color: #16A34A; --state-bg: #F0FDF4; --state-border: #BBF7D0;"
                        data-value="clear" role="radio" aria-checked="false">

                    <div class="state-option-glow" aria-hidden="true"></div>

                    <div class="state-option-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="m8 12 2.5 2.5L16 9"></path>
                        </svg>
                    </div>

                    <div class="state-option-content">
                        <h3 class="state-option-title">الصورة واضحة لدي</h3>
                        <p class="state-option-text">
                            أعرف أين أنا تقريبًا، وأعرف إلى أين أريد أن أصل.
                        </p>
                    </div>

                    <span class="state-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Partially Clear -->
                <button type="button" class="state-option"
                        style="--i: 1; --state-color: #2563EB; --state-bg: #EFF6FF; --state-border: #BFDBFE;"
                        data-value="partially_clear" role="radio" aria-checked="false">

                    <div class="state-option-glow" aria-hidden="true"></div>

                    <div class="state-option-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 8v4"></path>
                            <path d="M12 16h.01"></path>
                        </svg>
                    </div>

                    <div class="state-option-content">
                        <h3 class="state-option-title">لدي جزء من الصورة</h3>
                        <p class="state-option-text">
                            أعرف بعض الأمور، لكن هناك أمور أخرى غير واضحة لي.
                        </p>
                    </div>

                    <span class="state-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Uncertain -->
                <button type="button" class="state-option"
                        style="--i: 2; --state-color: #D97706; --state-bg: #FFFBEB; --state-border: #FDE68A;"
                        data-value="uncertain" role="radio" aria-checked="false">

                    <div class="state-option-glow" aria-hidden="true"></div>

                    <div class="state-option-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.7c-.9.8-1.8 1.2-1.8 2.8"></path>
                            <path d="M12 17h.01"></path>
                        </svg>
                    </div>

                    <div class="state-option-content">
                        <h3 class="state-option-title">لست متأكدًا أين أقف</h3>
                        <p class="state-option-text">
                            لدي هدف، لكنني لا أستطيع تحديد وضعي الحالي أو ما ينقصني.
                        </p>
                    </div>

                    <span class="state-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

                <!-- Overwhelmed -->
                <button type="button" class="state-option"
                        style="--i: 3; --state-color: #DC2626; --state-bg: #FEF2F2; --state-border: #FECACA;"
                        data-value="overwhelmed" role="radio" aria-checked="false">

                    <div class="state-option-glow" aria-hidden="true"></div>

                    <div class="state-option-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 7h16"></path>
                            <path d="M4 12h10"></path>
                            <path d="M4 17h7"></path>
                        </svg>
                    </div>

                    <div class="state-option-content">
                        <h3 class="state-option-title">أشعر أن الأمور متداخلة</h3>
                        <p class="state-option-text">
                            لدي معلومات ومحاولات كثيرة، لكنني لا أعرف ما هو الأهم الآن.
                        </p>
                    </div>

                    <span class="state-option-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m5 12 4 4L19 6"></path>
                        </svg>
                    </span>
                </button>

            </section>


            <!-- ACTIONS -->
            <div class="onboarding-actions">
                <button id="continueButton" type="button"
                        class="primary-button primary-button-large"
                        disabled data-cta="continue-current-state">
                    <span class="button-shine" aria-hidden="true"></span>
                    <span>التالي</span>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m13 6 6 6-6 6"></path>
                    </svg>
                </button>

                <p class="onboarding-note">
                    إجابتك هنا تساعد NEXT على تحديد نقطة البداية المناسبة لك.
                </p>
            </div>

        </main>


        <!-- FOOTER -->
        <footer class="onboarding-footer">
            © 2026 NEXT — افهم أولًا. تحرّك ثانيًا.
        </footer>

    </div>


    <!-- SCRIPTS -->
    <script src="scripts/core/storage.js"></script>
    <script src="scripts/core/session.js"></script>
    <script src="scripts/core/ui.js"></script>
    <script src="scripts/core/motion.js"></script>
    <script src="scripts/pages/current-state.js"></script>
    <!-- PWA Script -->
    <script src="scripts/core/pwa.js"></script>
</body>

</html>
