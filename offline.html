<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F8FA">
    <title>NEXT — غير متصل</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">

    <style>
        .offline-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--next-bg);
        }

        .offline-card {
            max-width: 480px;
            width: 100%;
            text-align: center;
            background: var(--next-surface);
            border: 1px solid var(--next-border);
            border-radius: 24px;
            padding: 56px 40px;
            box-shadow: 0 20px 60px -20px rgba(17, 24, 39, 0.12);
            animation: cardEnter 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .offline-icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            border: 1px solid #BFDBFE;
            border-radius: 28px;
            color: var(--next-blue);
            box-shadow: 0 12px 28px -8px rgba(37, 99, 235, 0.25);
        }

        .offline-icon svg {
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        .offline-title {
            margin: 0;
            color: var(--next-ink);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.3;
        }

        .offline-text {
            margin: 14px 0 0;
            color: var(--next-muted);
            font-size: 15px;
            line-height: 1.85;
        }

        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 32px;
        }

        .offline-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 56px;
            padding: 0 28px;
            background: var(--next-blue);
            border: 1px solid var(--next-blue);
            border-radius: 14px;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background-color 180ms cubic-bezier(0.4, 0, 0.2, 1),
                transform 240ms cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 240ms cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.35);
        }

        .offline-button:hover {
            background: var(--next-dark-blue);
            border-color: var(--next-dark-blue);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -4px rgba(37, 99, 235, 0.45);
        }

        .offline-hint {
            margin-top: 20px;
            color: #9CA3AF;
            font-size: 12px;
            line-height: 1.7;
        }

        @media (max-width: 640px) {
            .offline-card {
                padding: 40px 24px;
            }

            .offline-icon {
                width: 80px;
                height: 80px;
                border-radius: 24px;
            }

            .offline-title {
                font-size: 22px;
            }

            .offline-text {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="offline-shell">

        <div class="offline-card">

            <div class="offline-icon">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>

            <h1 class="offline-title">أنت غير متصل الآن.</h1>

            <p class="offline-text">
                لا تقلق — كل بياناتك محفوظة على جهازك.
                لما ترجع للإنترنت، كل شيء رح يرجع يعمل عادي.
            </p>

            <div class="offline-actions">
                <button type="button" class="offline-button" onclick="window.location.reload()">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                        <path d="M3 4v6h6"></path>
                    </svg>
                    حاول مرة أخرى
                </button>
            </div>

            <p class="offline-hint">
                © 2026 NEXT
            </p>

        </div>

    </div>

    <script>
        // إعادة تحميل تلقائية عند عودة الاتصال
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>

</body>

</html>
