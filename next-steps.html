    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">

<body data-page="next-steps">

    <div class="app-shell">

        <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

        <div data-component="sidebar"></div>

        <div class="main-area">

            <div data-component="topbar"></div>

            <main class="page-container">

                <section class="hero reveal" style="--i: 0;">
                    <div class="hero-eyebrow">
                        <span class="hero-eyebrow-dot"></span>
                        بعد أن فهمنا الصورة
                    </div>
                    <h1 class="hero-title">خطوتك التالية.</h1>
                    <p class="hero-description">
                        الهدف ليس أن نملأ وقتك بالمهام.
                        الهدف أن نختار الخطوات التي تساعدك فعلًا
                        على التحرك من مكانك الحالي.
                    </p>
                </section>

                <section class="reveal" id="primarySection" style="--i: 1;">
                    <div class="primary-step-label">
                        <span class="primary-step-dot" aria-hidden="true"></span>
                        ابدأ بهذه أولًا
                    </div>

                    <article class="primary-step-card">
                        <span class="priority-badge">الأولوية الآن</span>
                        <h2 id="primaryStepTitle" class="primary-step-title"></h2>
                        <p id="primaryStepReason" class="primary-step-reason"></p>

                        <div class="primary-step-grid">
                            <div class="primary-step-box">
                                <p class="primary-step-box-label">لماذا هذه الخطوة؟</p>
                                <p id="primaryStepWhy" class="primary-step-box-value"></p>
                            </div>

                            <div class="primary-step-box">
                                <p class="primary-step-box-label">النتيجة المتوقعة</p>
                                <p id="primaryStepOutcome" class="primary-step-box-value"></p>
                            </div>
                        </div>

                        <div class="primary-step-footer">
                            <div class="primary-step-meta">
                                <span class="primary-step-meta-item">
                                    الجهد:
                                    <span id="primaryStepEffort" class="primary-step-meta-value"></span>
                                </span>
                                <span class="primary-step-meta-divider"></span>
                                <span class="primary-step-meta-item">
                                    الوقت:
                                    <span id="primaryStepTime" class="primary-step-meta-value"></span>
                                </span>
                            </div>

                            <button id="primaryActionButton" type="button" class="primary-button" data-cta="primary-action">
                                <span>عرض التفاصيل</span>
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M5 12h14"></path>
                                    <path d="m13 6 6 6-6 6"></path>
                                </svg>
                            </button>
                        </div>
                    </article>
                </section>

                <section class="reveal" id="secondarySection" style="--i: 2;">
                    <div class="section-heading">
                        <h2 class="section-title">بعدها</h2>
                        <span class="section-hint">خطوتان</span>
                    </div>

                    <div class="secondary-grid">
                        <article class="secondary-card">
                            <div class="secondary-card-header">
                                <div class="secondary-card-number">02</div>
                                <div>
                                    <h3 id="secondaryStepOneTitle" class="secondary-card-title"></h3>
                                    <p id="secondaryStepOneText" class="secondary-card-text"></p>
                                </div>
                            </div>
                        </article>

                        <article class="secondary-card">
                            <div class="secondary-card-header">
                                <div class="secondary-card-number">03</div>
                                <div>
                                    <h3 id="secondaryStepTwoTitle" class="secondary-card-title"></h3>
                                    <p id="secondaryStepTwoText" class="secondary-card-text"></p>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>

                <section class="explanation-card reveal" id="explanationSection" style="--i: 3;">
                    <div class="explanation-icon" aria-hidden="true">?</div>
                    <div>
                        <h2 class="explanation-title">لماذا هذه الخطوات؟</h2>
                        <p id="stepsExplanation" class="explanation-text"></p>
                    </div>
                </section>

                <div class="action-area reveal" id="actionArea" style="--i: 4;">
                    <button id="backButton" type="button" class="secondary-button">
                        رجوع
                    </button>
                    <button id="dashboardButton" type="button" class="ghost-button">
                        العودة إلى الرئيسية
                    </button>
                </div>

            </main>

        </div>

    </div>

    <script src="scripts/core/storage.js"></script>
    <script src="scripts/core/session.js"></script>
    <script src="scripts/core/nav-config.js"></script>

    <script src="scripts/core/pwa.js"></script>

</html>
