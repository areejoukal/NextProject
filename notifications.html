<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->

    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://next.app/notifications.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NEXT">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:title" content="الإشعارات — NEXT">
    <meta property="og:description" content="آخر المستجدات في رحلتك، وما يستحق انتباهك فقط. بدون تنبيهات زائدة.">
    <meta property="og:url" content="https://next.app/notifications.html">
    <meta property="og:image" content="https://next.app/icons/og-notifications.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="NEXT — الإشعارات">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="الإشعارات — NEXT">
    <meta name="twitter:description" content="آخر المستجدات في رحلتك، وما يستحق انتباهك فقط.">
    <meta name="twitter:image" content="https://next.app/icons/og-notifications.png">
    <meta name="twitter:image:alt" content="NEXT — الإشعارات">

    <!-- Theme -->
    <meta name="theme-color" content="#F7F8FA">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-72.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEXT">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="NEXT">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        next: {
                            blue: '#2563EB',
                            blueDark: '#1D4ED8',
                            ink: '#111827',
                            muted: '#6B7280',
                            mutedStrong: '#4B5563',
                            bg: '#F7F8FA',
                            surface: '#FFFFFF',
                            border: '#E5E7EB',
                            success: '#16A34A',
                            warning: '#D97706',
                            danger: '#DC2626'
                        }
                    },
                    fontFamily: {
                        arabic: ['IBM Plex Sans Arabic', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/motion.css">
    <link rel="stylesheet" href="styles/pages/notifications.css">
</head>

<body data-page="notifications">

    <div class="app-shell">

        <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

        <div data-component="sidebar"></div>

        <div class="main-area">

            <div data-component="topbar"></div>

            <main class="page-container">

                <header class="page-header reveal" style="--i: 0;">
                    <div class="page-kicker">
                        <span class="page-kicker-dot" aria-hidden="true"></span>
                        آخر المستجدات في رحلتك
                    </div>

                    <h1 class="page-title">الإشعارات</h1>

                    <p class="page-description">
                        الأمور التي تستحق انتباهك فقط.
                        NEXT لا يرسل لك تنبيهات لمجرد وجود شيء جديد؛
                        الإشعار هنا مرتبط بما يحدث فعلًا في رحلتك.
                    </p>
                </header>

                <section class="card reveal" style="--i: 1;">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">إشعاراتك</h2>
                            <p class="card-description">
                                <span id="unreadCount">0</span> غير مقروءة
                            </p>
                        </div>

                        <button id="markAllReadButton" class="secondary-button" type="button" data-cta="mark-all-read" style="height: 40px; font-size: 13px;">
                            تعليم الكل كمقروء
                        </button>
                    </div>

                    <div id="notificationsList"></div>

                    <div id="emptyState" class="empty-state" style="display: none;">
                        <div class="empty-icon" aria-hidden="true">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                        </div>
                        <div class="empty-title">لا توجد إشعارات جديدة</div>
                        <p class="empty-text">
                            عندما يحدث شيء مهم في رحلتك،
                            ستجده هنا. حاليًا لا يوجد ما يستحق انتباهك.
                        </p>
                    </div>
                </section>

            </main>

        </div>

    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="scripts/core/storage.js"></script>
    <script src="scripts/core/session.js"></script>
    <script src="scripts/core/nav-config.js"></script>
    <script src="scripts/core/components.js"></script>
    <script src="scripts/core/ui.js"></script>
    <script src="scripts/core/motion.js"></script>
    <script src="scripts/pages/notifications.js"></script>
    <!-- PWA Script -->
    <script src="scripts/core/pwa.js"></script>
</body>

</html>
